<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

 <div class="main">
    <div class="container">
        <h1>My Coding Journey</h1>

        <div class="timer">

            <div class="time-box">
                <span id="days">00</span>
                <p>DAYS</p>
            </div>

            <div class="time-box">
                <span id="hours">00</span>
                <p>HOURS</p>
            </div>

            <div class="time-box">
                <span id="minutes">00</span>
                <P>MINUTES</P>
            </div>

            <div class="time-box">
                <span id="seconds">00</span>
                <p>SECONDS</p>
            </div>
        </div>
        <div class="link">
                <a href="../index.html">My Personal Website</a>
               </div>
    </div>
    </div>
      
    
  <script src="script.js"></script>
</body>
</html>
